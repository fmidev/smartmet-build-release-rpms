version: 2.1
jobs:
  build:
    parameters:
      image:
        type: string
      rhel:
        type: string
      upload_dirs:
        type: string
        default: "beta"
    docker:
      - image: << parameters.image >>
    resource_class: xlarge
    environment:
      RPM_BUILD_NCPUS: 8
    steps:
      - checkout
      - run:
          name: Install smartmet-utils-devel
          command: sudo yum install -y smartmet-utils-devel
      - run:
          name: Create local mirrors of smartmet repos (open sources only)
          command: smartbuild --create-workspace --config smartbuild.json --recursive --update --https --branch master:main
      - run:
          name: Build new release RPMs
          command: |
             mkdir -p workspace/export/smartmet-open/rhel/<< parameters.rhel >> workspace/log
             smartbuild --config smartbuild.json --builddep --recursive --local --release-rpms --separate-logs --branch master:main
      - run:
          name: Smoke test smartmetd with installed plugins and engines
          command: ./smoke-test.sh
      - run:
          name: Archive newly built RPM packages and build/install related log files
          command: ./archive-files.sh
          when: always
      - store_artifacts:
          when: always
          path: artifacts
      - run:
          name: Upload RPMs for download.fmi.fi
          command: |
             ok=true;
             for dir in << parameters.upload_dirs >> ; do
                  path=workspace/export/smartmet-open/rhel/<< parameters.rhel >>/$dir
                  test -d $path || continue
                  for rpm in $(find $path -name '*.rpm'); do
                      if curl --show-error -u $FMI_RPM_API_USER:$FMI_RPM_API_PASS -F file=@$rpm https://$RHEL<< parameters.rhel >>_BETA_UPLOAD_HOST/api/upload ; then
                          echo "Uploaded $(basename $rpm) from $dir";
                      else
                          echo "Failed to upload $(basename $rpm)";
                          ok=false
                      fi
                  done
             done
             $ok

workflows:
  build-release-rpms:
    when:
        and:
          - equal [ scheduled_pipeline, << pipeline.trigger_source >> ]
          - equal [ "release-rpm-build", << pipeline.schedule.name >> ]
    jobs:
      - build:
          name: build-rhel8
          image: fmidev/smartmet-cibase-8:latest
          rhel: "8"
      - build:
          name: build-rhel9
          image: fmidev/smartmet-cibase-9:latest
          rhel: "9"
          upload_dirs: "debug x86_64 beta"
      - build:
          name: build-rhel10
          image: quay.io/fmi/smartmet-cibase-10:latest
          rhel: "10"
